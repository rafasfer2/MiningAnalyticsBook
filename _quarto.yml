project:
  type: book
  output-dir: docs

lang: pt-BR

book:
  title: "Sistema de Gestão e Excelência Operacional na Mineração"
  subtitle: "Análise de Indicadores e Data Science com R"
  author: "Rafael da Silva Fernandes"
  date: last-modified

  sidebar:
    style: docked
    collapse-level: 3
    search: true

  chapters:
    - index.qmd
    - intro.qmd

    # PARTE 1: Fundamentos, Gestão e Modelagem da Qualidade
    - part: chapters/part1-intro.qmd
      chapters:
        - chapters/cap1-fundamentos.qmd          # Conteúdo do Capítulo 1 (Evolução, QTP, ISO)
        - chapters/cap2-gestao-qualidade.qmd     # Conteúdo do Capítulo 2 (Juran, Metas, TQM, CCQ)
        - chapters/cap3-controle-diretrizes.qmd  # Conteúdo do Capítulo 3 (Liderança, Hoshin Kanri, KPIs)
        - chapters/cap4-ciclo-pdca.qmd           # Conteúdo do Capítulo 4 (Método MASP passo a passo)
        - chapters/cap5-caixa-ferramentas.qmd    # Conteúdo do Capítulo 5 (Qualidade 4.0, Custos, FMEA)

    # PARTE 2: Aplicação Operacional na Mineração (Ciclo de Mina)
    - part: chapters/part2-intro.qmd
      chapters:
        - chapters/ciclo1-perfuracao.qmd
        - chapters/ciclo2-carregamento.qmd
        - chapters/ciclo3-transporte.qmd

    # PARTE 3: Gestão de Ativos, Manutenção e Confiabilidade
    - part: chapters/part3-intro.qmd
      chapters:
        - chapters/plan-crtl-opera.qmd
        - chapters/plan-crtl-manut.qmd
        - chapters/modelagem_manut.qmd
        - chapters/confiabilidade.qmd

  appendices:
    - chapters/appendix/a-dicionario-dados.qmd
    - chapters/appendix/b-dicionario-indicadores.qmd
    - chapters/appendix/c-notacoes-abreviacoes.qmd
    - chapters/appendix/d-lista-exemplos.qmd
    - chapters/appendix/e-lista-figuras.qmd
    - chapters/appendix/f-lista-tabelas.qmd

execute:
  freeze: auto
  code-init: source("_common.R")

crossref:
  chapters: true
  fig-prefix: "Figura"
  tbl-prefix: "Tabela"
  exm-title: "Exemplo"
  exm-prefix: "Exemplo"
  eq-prefix: "Eq."

bibliography: references.bib

format:
  html:
    theme: flatly
    css: styles/styles.css
    include-after-body: includes/after-body.html
    code-fold: true
    toc: true
    toc-depth: 3
    number-sections: true
