project:
  type: book
  output-dir: docs

lang: pt-BR

book:
  title: "Sistema de Gestão e Excelência Operacional na Mineração"
  subtitle: "Análise de Indicadores e Data Science com R"
  author: "Rafael da Silva Fernandes"
  date: last-modified

  sidebar:
    style: docked
    collapse-level: 3
    search: true

  chapters:
    - index.qmd
    - intro.qmd

    # PARTE 1: Introdução à Engenharia da Qualidade
    - part: chapters/part1-intro.qmd
      chapters:
        - chapters/cap1-fundamentos.qmd          # Cap 1: Filosofia, Evolução e ISO 9000
        - chapters/cap2-modelos-gestao.qmd       # Cap 2: TQM, Lean, Seis Sigma e VPS
        - chapters/cap3-motor-matematico.qmd     # Cap 3: Quantificação, ARM e Modelagem
        - chapters/cap4-alma-estrategia.qmd      # Cap 4: GPD, Hoshin Kanri e Engenharia de Metas
        - chapters/cap5-cerebro-operacao.qmd     # Cap 5: Trilogia de Juran, PDCA e MASP
        - chapters/cap6-caixa-ferramentas.qmd    # Cap 6: Ferramentas da Qualidade
        - chapters/cap7-estudos-casos.qmd        # Cap 7: Aplicações Multidimensionais e Prática Mineral

# PARTE 2: Metrologia, Gestão de Ativos e Confiabilidade
    - part: chapters/part2-intro.qmd
      chapters:
        - chapters/cap8-metrologia-kpi.qmd       # Cap 8: Metrologia Operacional (Telemetria, DF, UF, RO, OEE)
        - chapters/cap9-gestao-ativos-pco.qmd    # Cap 9: Gestão de Ativos e PCO (Planejamento da Mina)
        - chapters/cap10-plan-crtl-manut.qmd     # Cap 10: PCM (Planejamento e Controle da Manutenção)
        - chapters/cap11-iqpl-aprofundamento.qmd # Cap 11: Índice de Qualidade de Plano de Manutenção (IQPL)
        - chapters/cap12-indicadores-manut.qmd   # Cap 12: Indicadores de Manutenção (MTBF, MTTR, ISAC, ATSP, IDF)
        - chapters/cap13-confiabilidade.qmd      # Cap 13: Engenharia de Confiabilidade (Estatística Avançada e Processos de Contagem)
        - chapters/cap14-manut-imperfeita.qmd    # Cap 14: Manutenção Imperfeita (Ciclos PR, ABAO/AGAN)
        - chapters/cap15-exercicios-parte2.qmd    # Exercícios: Consolidação da Parte 2

    # PARTE 3: Aplicação Operacional na Mineração (Ciclo de Mina)
    - part: chapters/part3-intro.qmd
      chapters:
        - chapters/ciclo1-perfuracao.qmd
        - chapters/ciclo2-carregamento.qmd
        - chapters/ciclo3-transporte.qmd
        - chapters/ciclo4-exercicios-parte3.qmd   # Exercícios: Consolidação da Parte 3

  appendices:
    - chapters/appendix/a-dicionario-dados.qmd
    - chapters/appendix/b-dicionario-indicadores.qmd
    - chapters/appendix/c-notacoes-abreviacoes.qmd
    - chapters/appendix/d-lista-exemplos.qmd
    - chapters/appendix/e-lista-figuras.qmd
    - chapters/appendix/f-lista-tabelas.qmd
    - chapters/appendix/gabarito-parte1.qmd
    - chapters/appendix/g-perspectivas-qualidade-ensino.qmd

execute:
  freeze: auto
  code-init: source("_common.R")

crossref:
  chapters: true
  fig-prefix: "Figura"
  tbl-prefix: "Tabela"
  exm-title: "Exemplo"
  exm-prefix: "Exemplo"
  eq-prefix: "Eq."

bibliography: references.bib

format:
  html:
    theme: flatly
    css: styles/styles.css
    include-after-body: includes/after-body.html
    code-fold: true
    toc: true
    toc-depth: 3
    number-sections: true