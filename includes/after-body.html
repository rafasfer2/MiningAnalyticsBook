<script>
(() => {
	const isChapterPage = window.location.pathname.includes("/chapters/");
	const basePath = isChapterPage ? "../scripts/" : "scripts/";
	["set-toc-expanded.js", "caption-format.js", "toc-expand-on-click.js"].forEach((fileName) => {
		const script = document.createElement("script");
		script.src = `${basePath}${fileName}`;
		document.body.appendChild(script);
	});
})();
</script>

<script>
window.addEventListener("load", async function () {
	if (!window.mermaid || !window.mermaid.mermaidAPI) {
		return;
	}

	let i = 0;
	const blocks = Array.from(document.querySelectorAll("pre.mermaid-js"));

	for (const el of blocks) {
		// Skip already rendered blocks.
		if (el.querySelector("svg")) {
			continue;
		}

		const source = (el.textContent || "").replaceAll("&nbsp;", " ");

		try {
			const id = `mermaid-safe-${++i}`;
			const result = await window.mermaid.mermaidAPI.render(id, source, el);
			el.innerHTML = result.svg;

			if (el.dataset.label) {
				const svg = el.firstChild;
				const style = svg && svg.querySelector ? svg.querySelector("style") : null;
				if (style && svg && svg.id) {
					style.innerHTML = style.innerHTML.replaceAll(`#${svg.id}`, `#${el.dataset.label}-mermaid`);
					svg.id = `${el.dataset.label}-mermaid`;
				}
			}
		} catch (err) {
			console.error("Mermaid render falhou para um bloco:", err);
		}
	}
});
</script>

<script>
(() => {
	const stateKey = "sidebar-collapsed";
	const headerWidthKey = "header-width-mode";
	const fontScaleKey = "main-font-scale";
	const minScale = 0.85;
	const maxScale = 1.5;
	const step = 0.05;
	let initialized = false;

	const clamp = (value) => Math.max(minScale, Math.min(maxScale, value));

	const getScale = () => {
		const stored = parseFloat(localStorage.getItem(fontScaleKey));
		return Number.isFinite(stored) ? clamp(stored) : 1;
	};

	const setScale = (value) => {
		const safe = clamp(value);
		document.documentElement.style.setProperty("--main-font-scale", String(safe));
		localStorage.setItem(fontScaleKey, String(safe));
	};

	function getControlHost() {
		const tocHost = document.querySelector("#quarto-margin-sidebar") ||
			document.querySelector("#quarto-toc-target");
		const fallbackHost = document.querySelector("#quarto-header .navbar-container") ||
			document.querySelector("#quarto-header .container-fluid");

		if (!tocHost) {
			const useFallback = window.matchMedia("(max-width: 1280px)").matches;
			return useFallback ? fallbackHost : null;
		}

		let toolsHost = document.querySelector(".toc-quick-controls");
		if (!toolsHost) {
			toolsHost = document.createElement("div");
			toolsHost.className = "toc-quick-controls";
			tocHost.prepend(toolsHost);
		}

		return toolsHost;
	}

	function ensureControls() {
		if (initialized) return true;

		const host = getControlHost();
		if (!host) return false;

		setScale(getScale());

		const setMenuButtonUI = (collapsed) => {
			const menuBtn = document.querySelector(".menu-toggle-btn");
			if (!menuBtn) return;
			menuBtn.innerHTML = collapsed
				? '<span class="menu-icon" aria-hidden="true">&#9776;</span><span class="menu-label">Mostrar menu</span>'
				: '<span class="menu-icon" aria-hidden="true">&#9776;</span><span class="menu-label">Ocultar menu</span>';
			menuBtn.setAttribute("aria-pressed", collapsed ? "true" : "false");
		};

		const applySidebarState = (collapsed) => {
			document.body.classList.toggle("sidebar-collapsed", collapsed);
			localStorage.setItem(stateKey, collapsed ? "1" : "0");
			setMenuButtonUI(collapsed);
		};

		const applyHeaderWidthMode = (mode) => {
			const safeMode = mode === "wide" ? "wide" : "standard";
			document.body.classList.toggle("header-wide", safeMode === "wide");
			localStorage.setItem(headerWidthKey, safeMode);

			const btn = document.querySelector(".header-width-btn");
			if (btn) {
				btn.innerHTML = safeMode === "wide"
					? '<span aria-hidden="true">↔</span><span>Largura: Ampla</span>'
					: '<span aria-hidden="true">↔</span><span>Largura: Padrão</span>';
			}
		};

		const savedHeaderMode = localStorage.getItem(headerWidthKey);
		applyHeaderWidthMode(savedHeaderMode === "wide" ? "wide" : "standard");

		if (!document.querySelector(".header-width-btn")) {
			const headerWidthBtn = document.createElement("button");
			headerWidthBtn.type = "button";
			headerWidthBtn.className = "sidebar-toggle-btn header-width-btn";
			headerWidthBtn.addEventListener("click", function () {
				const current = localStorage.getItem(headerWidthKey) === "wide" ? "wide" : "standard";
				const next = current === "wide" ? "standard" : "wide";
				if (next === "wide") {
					applySidebarState(true);
				} else {
					applySidebarState(false);
				}
				applyHeaderWidthMode(next);
			});
			host.appendChild(headerWidthBtn);
			applyHeaderWidthMode(localStorage.getItem(headerWidthKey) === "wide" ? "wide" : "standard");
		}

		if (!document.querySelector(".menu-toggle-btn")) {
			const toggleBtn = document.createElement("button");
			toggleBtn.type = "button";
			toggleBtn.className = "sidebar-toggle-btn menu-toggle-btn";
			if (host.classList.contains("toc-quick-controls")) {
				toggleBtn.classList.add("toc-sidebar-toggle-btn");
			}

			const initialCollapsed = localStorage.getItem(stateKey) === "1";
			setMenuButtonUI(initialCollapsed);

			toggleBtn.addEventListener("click", function () {
				const next = !document.body.classList.contains("sidebar-collapsed");
				applySidebarState(next);
			});

			host.appendChild(toggleBtn);
		}

		const initialCollapsed = localStorage.getItem(stateKey) === "1";
		applySidebarState(initialCollapsed);

		if (localStorage.getItem(headerWidthKey) === "wide") {
			applySidebarState(true);
		}

		if (!document.querySelector(".toc-font-controls")) {
			const controls = document.createElement("div");
			controls.className = "main-font-controls toc-font-controls";
			controls.innerHTML = [
				'<span class="font-label">Fonte:</span>',
				'<button type="button" data-action="decrease" title="Diminuir fonte">A-</button>',
				'<button type="button" data-action="reset" title="Fonte padrão">A</button>',
				'<button type="button" data-action="increase" title="Aumentar fonte">A+</button>'
			].join("");

			controls.addEventListener("click", function (ev) {
				const button = ev.target.closest("button[data-action]");
				if (!button) return;

				const current = getScale();
				const action = button.dataset.action;

				if (action === "decrease") setScale(current - step);
				if (action === "increase") setScale(current + step);
				if (action === "reset") setScale(1);
			});

			host.appendChild(controls);
		}

		initialized = true;
		return true;
	}

	if (!ensureControls()) {
		document.addEventListener("DOMContentLoaded", ensureControls, { once: true });
		window.addEventListener("load", ensureControls, { once: true });

		if (document.body) {
			const observer = new MutationObserver(() => {
				if (ensureControls()) observer.disconnect();
			});
			observer.observe(document.body, { childList: true, subtree: true });
		}
	}
})();
</script>

<script>
window.addEventListener("DOMContentLoaded", function () {
	const contentRoot = document.querySelector("main.content") || document;
	const candidates = contentRoot.querySelectorAll("figure img, .quarto-figure img, main.content img");

	const modal = document.createElement("div");
	modal.className = "figure-lightbox";
	modal.setAttribute("aria-hidden", "true");
	modal.innerHTML = [
		'<div class="figure-lightbox__panel" role="dialog" aria-modal="true" aria-label="Visualizador de figura">',
		'  <div class="figure-lightbox__toolbar">',
		'    <a class="figure-lightbox__open" target="_blank" rel="noopener noreferrer">Abrir em nova guia</a>',
		'    <button type="button" class="figure-lightbox__close" aria-label="Fechar">Fechar</button>',
		'  </div>',
		'  <div class="figure-lightbox__image-wrap">',
		'    <img class="figure-lightbox__image" alt="" />',
		'  </div>',
		'  <div class="figure-lightbox__caption"></div>',
		'</div>'
	].join("");

	document.body.appendChild(modal);

	const modalImage = modal.querySelector(".figure-lightbox__image");
	const modalCaption = modal.querySelector(".figure-lightbox__caption");
	const modalOpenLink = modal.querySelector(".figure-lightbox__open");
	const closeButton = modal.querySelector(".figure-lightbox__close");

	const openModal = (img) => {
		const src = img.currentSrc || img.src;
		if (!src) return;

		const fig = img.closest("figure") || img.closest(".quarto-figure");
		const captionNode = fig && fig.querySelector("figcaption, .quarto-float-caption");
		const caption = captionNode ? (captionNode.textContent || "").trim() : "";

		modalImage.src = src;
		modalImage.alt = img.alt || caption || "Figura";
		modalCaption.textContent = caption;
		modalOpenLink.href = src;
		modal.classList.add("is-open");
		modal.setAttribute("aria-hidden", "false");
		document.body.style.overflow = "hidden";
	};

	const closeModal = () => {
		modal.classList.remove("is-open");
		modal.setAttribute("aria-hidden", "true");
		modalImage.removeAttribute("src");
		modalCaption.textContent = "";
		modalOpenLink.removeAttribute("href");
		document.body.style.overflow = "";
	};

	candidates.forEach((img) => {
		if (img.classList.contains("zoomable-figure")) return;
		img.classList.add("zoomable-figure");

		img.addEventListener("click", (ev) => {
			ev.preventDefault();
			ev.stopPropagation();
			openModal(img);
		});
	});

	closeButton.addEventListener("click", closeModal);
	modal.addEventListener("click", (ev) => {
		if (ev.target === modal) closeModal();
	});
	document.addEventListener("keydown", (ev) => {
		if (ev.key === "Escape" && modal.classList.contains("is-open")) {
			closeModal();
		}
	});
});
</script>
